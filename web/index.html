<!doctype html>
<html lang="ko">
<head>
  <meta charset="utf-8" />
  <title>웹캠 재활용품 실시간 분류</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <main>
    <h1>♻️ 웹캠 재활용품 실시간 분류</h1>
    <p id="status">모델을 불러오는 중...</p>

    <div class="stage">
      <video id="webcam" autoplay muted playsinline></video>
      <canvas id="overlay"></canvas>
    </div>

    <label class="confidence-control">
      신뢰도 임계값: <span id="confidence-value">0.40</span>
      <input id="confidence" type="range" min="0.05" max="0.95" step="0.05" value="0.4" />
    </label>
  </main>

  <script src="https://cdn.jsdelivr.net/npm/@tensorflow/tfjs@4.19.0/dist/tf.min.js"></script>
  <script src="script.js"></script>
</body>
</html>
